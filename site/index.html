<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Matuto-Man: o logo do Matuto Programador comendo bits e fugindo dos bugs num labirinto estilo Pac-Man.">
<meta property="og:title" content="Matuto-Man">
<meta property="og:description" content="Coma os bits, fuja do NullPointer, do Deadlock, do Legacy e do Deploy na Sexta.">
<meta property="og:type" content="website">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>Matuto-Man</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: one arcade screen. Maze canvas centered, HUD above, controls below. Dark CRT / Matrix look by choice (single theme). */
:root {
  --bg: #040705;
  --panel: #0a120c;
  --fg: #d7f3dc;
  --muted: #6f9a78;
  --green: #3dff6e;
  --green-dim: #15602b;
  --wall: #0d3a1c;
  --wall-edge: #2ef05f;
  --amber: #ffc24a;
  --red: #ff4d4d;
  --pink: #ff7ad9;
  --cyan: #4de9ff;
  --orange: #ff9f45;
  --fright: #2436c8;
  --display: "Press Start 2P", "Courier New", monospace;
  --mono: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--mono);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  box-sizing: border-box; overflow-x: hidden;
}
#rain { position: fixed; inset: 0; z-index: 0; opacity: .22; pointer-events: none; }
.wrap { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-size: clamp(14px, 3.4vw, 22px); color: var(--green); margin: 0; letter-spacing: 1px; text-shadow: 0 0 12px rgba(61,255,110,.55); text-wrap: balance; }
h1 small { display: block; font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-top: 6px; font-weight: 400; }
.hud { display: grid; grid-template-columns: repeat(3, auto); gap: 6px 18px; font-family: var(--display); font-size: 10px; font-variant-numeric: tabular-nums; }
.hud span { color: var(--muted); display: block; margin-bottom: 5px; font-size: 8px; letter-spacing: 1px; }
.hud b { font-weight: 400; color: var(--fg); }
.stage { position: relative; width: 100%; aspect-ratio: 21 / 21; max-width: 100%; border: 2px solid var(--green-dim); border-radius: 6px; background: var(--panel); box-shadow: 0 0 0 1px #000 inset, 0 0 40px rgba(61,255,110,.12); overflow: hidden; touch-action: none; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: rgba(4,7,5,.82); text-align: center; padding: 20px; }
.overlay h2 { font-family: var(--display); font-size: clamp(14px, 3.6vw, 22px); color: var(--green); margin: 0; text-shadow: 0 0 14px rgba(61,255,110,.6); text-wrap: balance; line-height: 1.6; }
.overlay p { margin: 0; color: var(--muted); font-size: 13px; max-width: 42ch; line-height: 1.5; }
.btn { font-family: var(--display); font-size: 11px; padding: 12px 18px; background: var(--green); color: #031; border: 0; border-radius: 4px; cursor: pointer; box-shadow: 0 0 18px rgba(61,255,110,.5); }
.btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.btn:hover { filter: brightness(1.1); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.lives { display: flex; gap: 6px; align-items: center; }
.lives img { width: 22px; height: 22px; filter: drop-shadow(0 0 4px rgba(61,255,110,.5)); }
.ghosts { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; }
.ghosts i { display: inline-block; width: 10px; height: 10px; border-radius: 5px 5px 2px 2px; margin-right: 5px; vertical-align: -1px; }
.ico { background: transparent; border: 1px solid var(--green-dim); color: var(--fg); border-radius: 4px; padding: 6px 10px; font-family: var(--mono); font-size: 12px; cursor: pointer; }
.ico:focus-visible { outline: 2px solid var(--green); }
.pad { display: none; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 58px); gap: 6px; margin: 4px auto 0; user-select: none; }
.pad button { font-size: 22px; background: var(--panel); color: var(--green); border: 1px solid var(--green-dim); border-radius: 8px; touch-action: manipulation; }
.pad button:active { background: var(--green-dim); }
.pad .u { grid-column: 2; grid-row: 1 } .pad .l { grid-column: 1; grid-row: 2 } .pad .r { grid-column: 3; grid-row: 2 } .pad .d { grid-column: 2; grid-row: 3 }
@media (pointer: coarse) { .pad { display: grid; } .keys { display: none; } }
.keys { font-size: 12px; color: var(--muted); line-height: 1.7; }
kbd { font-family: var(--mono); border: 1px solid var(--green-dim); border-radius: 3px; padding: 0 5px; color: var(--fg); }
@media (prefers-reduced-motion: reduce) { #rain { display: none; } }
</style>

</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <h1>MATUTO-MAN<small>O melhor comedor de bits do mundo</small></h1>
    <div class="hud">
      <div><span>SCORE</span><b id="score">0</b></div>
      <div><span>HI-SCORE</span><b id="hi">0</b></div>
      <div><span>LEVEL</span><b id="level">1</b></div>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">MATUTO-MAN</h2>
      <p id="ovText">Coma todos os bits do labirinto sem ser pego pelos bugs. O <b>$</b> deixa os bugs em modo debug: aí é você quem come eles.</p>
      <button class="btn" id="startBtn">INSERT COIN ▶</button>
    </div>
  </div>

  <div class="bar">
    <div class="lives" id="lives" aria-label="vidas"></div>
    <div class="ghosts">
      <span><i style="background:var(--red)"></i>NullPointer</span>
      <span><i style="background:var(--pink)"></i>Deadlock</span>
      <span><i style="background:var(--cyan)"></i>Legacy</span>
      <span><i style="background:var(--orange)"></i>Deploy na Sexta</span>
    </div>
    <div style="display:flex;gap:6px">
      <button class="ico" id="muteBtn" aria-label="som">🔊 som</button>
      <button class="ico" id="pauseBtn" aria-label="pausar">⏸ pausa</button>
    </div>
  </div>

  <div class="keys">Setas ou <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> movem · <kbd>P</kbd> pausa · <kbd>Enter</kbd> começa</div>
  <div class="pad" id="pad">
    <button class="u" data-d="0,-1" aria-label="cima">▲</button>
    <button class="l" data-d="-1,0" aria-label="esquerda">◀</button>
    <button class="r" data-d="1,0" aria-label="direita">▶</button>
    <button class="d" data-d="0,1" aria-label="baixo">▼</button>
  </div>
</div>

// ---------- Maze ----------
const RAW = [
"WWWWWWWWWWWWWWWWWWWWW",
"W.........W.........W",
"WoWWW.WWW.W.WWW.WWWoW",
"W...................W",
"W.WWW.W.WWWWW.W.WWW.W",
"W.....W...W...W.....W",
"WWWWW.WWWWWWWWW.WWWWW",
"WWWWW.W       W.WWWWW",
"WWWWW.W WW-WW W.WWWWW",
"     .  WGGGW  .     ",
"WWWWW.W WWWWW W.WWWWW",
"WWWWW.W       W.WWWWW",
"WWWWW.W WWWWW W.WWWWW",
"W.........W.........W",
"W.WWW.WWW.W.WWW.WWW.W",
"Wo..W.....P.....W..oW",
"WWW.W.W.WWWWW.W.W.WWW",
"W.....W...W...W.....W",
"W.WWWWWWW.W.WWWWWWW.W",
"W...................W",
"WWWWWWWWWWWWWWWWWWWWW"];
const ROWS = RAW.length, COLS = RAW[0].length;
const T = 32; // logical tile px
let grid, pelletsLeft, playerStart, houseCells = [], doorCell, totalPellets;

function buildGrid() {
  grid = []; pelletsLeft = 0; houseCells = [];
  for (let y = 0; y < ROWS; y++) {
    grid[y] = [];
    for (let x = 0; x < COLS; x++) {
      const c = RAW[y][x];
      let cell = { wall: c === 'W', pellet: c === '.', power: c === 'o', door: c === '-', house: c === 'G' };
      if (c === 'P') playerStart = { x, y };
      if (c === 'G') houseCells.push({ x, y });
      if (c === '-') doorCell = { x, y };
      if (cell.pellet || cell.power) pelletsLeft++;
      grid[y][x] = cell;
    }
  }
  totalPellets = pelletsLeft;
}
const wrapX = x => (x + COLS) % COLS;
function cellAt(x, y) { if (y < 0 || y >= ROWS) return { wall: true }; return grid[y][wrapX(x)]; }
function passable(x, y, ghostDoor) { const c = cellAt(x, y); if (c.wall) return false; if (c.door && !ghostDoor) return false; return true; }

// ---------- Audio ----------
let actx = null, muted = false, wakaFlip = false;
function ac() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } } if (actx && actx.state === 'suspended') actx.resume(); return actx; }
function beep(freq, dur, type, vol, slide) {
  if (muted) return; const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(freq, a.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, a.currentTime + dur);
  g.gain.setValueAtTime(vol || .05, a.currentTime); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + dur);
  o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + dur);
}
const sfx = {
  waka() { wakaFlip = !wakaFlip; beep(wakaFlip ? 420 : 300, .07, 'square', .04); },
  power() { beep(200, .35, 'sawtooth', .06, 600); },
  ghost() { beep(900, .25, 'square', .06, 1600); },
  death() { beep(700, .9, 'sawtooth', .07, 80); },
  start() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, .15, 'square', .05), i * 120)); },
  life() { beep(1200, .3, 'triangle', .07, 1800); }
};

// ---------- State ----------
const DIRS = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
const OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };
let score = 0, hi = 0, level = 1, lives = 3, state = 'title'; // title | ready | play | dying | levelclear | gameover | paused
let player, ghosts, modeTimer, modeIndex, frightTimer = 0, ghostCombo = 0, readyTimer = 0, deathTimer = 0, clearTimer = 0, mouth = 0, extraLifeGiven = false, lastDotSound = 0;
const SCATTER_CHASE = [7, 20, 7, 20, 5, 20, 5, Infinity];
const GHOST_DEFS = [
  { name: 'NullPointer', color: '#ff4d4d', corner: { x: COLS - 2, y: 1 } },
  { name: 'Deadlock', color: '#ff7ad9', corner: { x: 1, y: 1 } },
  { name: 'Legacy', color: '#4de9ff', corner: { x: COLS - 2, y: ROWS - 2 } },
  { name: 'Deploy na Sexta', color: '#ff9f45', corner: { x: 1, y: ROWS - 2 } }
];
try { hi = parseInt(localStorage.getItem('matutoman.hi') || '0', 10) || 0; } catch (e) {}

function speedFor(lv) { return Math.min(5.2 + (lv - 1) * .35, 7.5); } // tiles / sec
function frightFor(lv) { return Math.max(2, 7 - (lv - 1) * .7); }

function resetActors() {
  player = { x: playerStart.x, y: playerStart.y, dir: 'left', want: 'left', moving: false };
  ghosts = GHOST_DEFS.map((d, i) => ({
    ...d, x: houseCells[Math.min(i, houseCells.length - 1)].x, y: houseCells[Math.min(i, houseCells.length - 1)].y,
    dir: i % 2 ? 'down' : 'up', mode: i === 0 ? 'exit' : 'house', houseWait: i * 2.5, fright: false, eaten: false, bob: 0
  }));
  // Blinky starts right above the door
  ghosts[0].x = doorCell.x; ghosts[0].y = doorCell.y - 1; ghosts[0].mode = 'normal'; ghosts[0].dir = 'left';
  modeIndex = 0; modeTimer = SCATTER_CHASE[0]; frightTimer = 0; ghostCombo = 0; mouth = 0;
}
function newGame() {
  score = 0; level = 1; lives = 3; extraLifeGiven = false; buildGrid(); resetActors(); startReady(); sfx.start(); updateHud();
}
function startReady() { state = 'ready'; readyTimer = 2.0; showOverlay('READY!', 'Nível ' + level + ' · ' + pelletsLeft + ' bits para comer', false); }
function nextLevel() { level++; buildGrid(); resetActors(); startReady(); updateHud(); }

// ---------- Input ----------
const keyMap = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
window.addEventListener('keydown', e => {
  if (keyMap[e.key]) { e.preventDefault(); if (player) player.want = keyMap[e.key]; if (state === 'ready' && readyTimer < 1.5) { readyTimer = 0; } }
  else if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') togglePause();
  else if (e.key === 'Enter' || e.key === ' ') { if (state === 'title' || state === 'gameover') newGame(); else if (state === 'paused') togglePause(); }
});
document.getElementById('pad').addEventListener('pointerdown', e => {
  const b = e.target.closest('button'); if (!b) return; e.preventDefault();
  const [dx, dy] = b.dataset.d.split(',').map(Number);
  if (player) player.want = dx === 1 ? 'right' : dx === -1 ? 'left' : dy === 1 ? 'down' : 'up';
});
// swipe on the stage
let sw = null;
const stage = document.getElementById('stage');
stage.addEventListener('pointerdown', e => { sw = { x: e.clientX, y: e.clientY }; });
stage.addEventListener('pointermove', e => {
  if (!sw || !player) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (Math.hypot(dx, dy) < 24) return;
  player.want = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'); sw = null;
});
stage.addEventListener('pointerup', () => { sw = null; });
document.getElementById('startBtn').addEventListener('click', () => { ac(); if (state === 'title' || state === 'gameover') newGame(); else if (state === 'paused') togglePause(); });
document.getElementById('pauseBtn').addEventListener('click', togglePause);
document.getElementById('muteBtn').addEventListener('click', function () { muted = !muted; this.textContent = muted ? '🔇 mudo' : '🔊 som'; });
function togglePause() {
  if (state === 'play') { state = 'paused'; showOverlay('PAUSA', 'O deploy pode esperar.', true, 'CONTINUAR ▶'); }
  else if (state === 'paused') { state = 'play'; hideOverlay(); }
}

// ---------- Overlay / HUD ----------
const overlay = document.getElementById('overlay'), ovTitle = document.getElementById('ovTitle'), ovText = document.getElementById('ovText'), startBtn = document.getElementById('startBtn');
function showOverlay(title, text, button, label) { ovTitle.textContent = title; ovText.textContent = text; startBtn.hidden = !button; if (label) startBtn.textContent = label; overlay.hidden = false; }
function hideOverlay() { overlay.hidden = true; }
function updateHud() {
  document.getElementById('score').textContent = score;
  document.getElementById('hi').textContent = hi;
  document.getElementById('level').textContent = level;
  const l = document.getElementById('lives'); l.innerHTML = '';
  for (let i = 0; i < lives; i++) { const im = document.createElement('img'); im.src = LOGO_SRC; im.alt = ''; l.appendChild(im); }
}
function addScore(n) {
  score += n;
  if (score > hi) { hi = score; try { localStorage.setItem('matutoman.hi', String(hi)); } catch (e) {} }
  if (!extraLifeGiven && score >= 10000) { extraLifeGiven = true; lives++; sfx.life(); }
  updateHud();
}

// ---------- Movement ----------
function atCenter(e) { return Math.abs(e.x - Math.round(e.x)) < 1e-4 && Math.abs(e.y - Math.round(e.y)) < 1e-4; }
function stepEntity(e, dist, canDoor, decide) {
  let guard = 0;
  while (dist > 0 && guard++ < 8) {
    if (atCenter(e)) {
      e.x = Math.round(e.x); e.y = Math.round(e.y);
      const d = decide(e); if (!d) { e.moving = false; return; }
      e.dir = d; e.moving = true;
    }
    const v = DIRS[e.dir];
    // target next center along dir
    const tx = v.x !== 0 ? (v.x > 0 ? Math.floor(e.x + 1e-6) + 1 : Math.ceil(e.x - 1e-6) - 1) : e.x;
    const ty = v.y !== 0 ? (v.y > 0 ? Math.floor(e.y + 1e-6) + 1 : Math.ceil(e.y - 1e-6) - 1) : e.y;
    const rem = Math.abs(tx - e.x) + Math.abs(ty - e.y);
    const mv = Math.min(rem, dist);
    e.x += v.x * mv; e.y += v.y * mv; dist -= mv;
    if (rem <= dist + 1e-9) { e.x = tx; e.y = ty; }
    if (e.x < -0.5) e.x += COLS; if (e.x > COLS - 0.5) e.x -= COLS;
  }
}
function playerDecide(p) {
  const w = DIRS[p.want];
  if (passable(p.x + w.x, p.y + w.y, false)) return p.want;
  const c = DIRS[p.dir];
  if (passable(p.x + c.x, p.y + c.y, false)) return p.dir;
  return null;
}
function dist2(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
function ghostTarget(g) {
  if (g.eaten) return { x: doorCell.x, y: doorCell.y - 1 };
  if (g.mode === 'exit') return { x: doorCell.x, y: doorCell.y - 1 };
  const chase = (modeIndex % 2 === 1);
  if (!chase) return g.corner;
  const pv = DIRS[player.dir];
  switch (g.name) {
    case 'NullPointer': return { x: player.x, y: player.y };
    case 'Deadlock': return { x: player.x + pv.x * 4, y: player.y + pv.y * 4 };
    case 'Legacy': { const b = ghosts[0]; const ax = player.x + pv.x * 2, ay = player.y + pv.y * 2; return { x: ax + (ax - b.x), y: ay + (ay - b.y) }; }
    default: return dist2(g.x, g.y, player.x, player.y) > 64 ? { x: player.x, y: player.y } : g.corner;
  }
}
function ghostDecide(g) {
  const inHouseZone = cellAt(g.x, g.y).house || cellAt(g.x, g.y).door;
  const canDoor = g.eaten || g.mode === 'exit';
  const t = ghostTarget(g);
  const opts = [];
  for (const k in DIRS) {
    if (k === OPP[g.dir] ) continue;
    const v = DIRS[k];
    if (!passable(g.x + v.x, g.y + v.y, canDoor)) continue;
    // ghosts in play never re-enter the house door unless eaten
    if (!g.eaten && g.mode !== 'exit' && cellAt(g.x + v.x, g.y + v.y).door) continue;
    opts.push(k);
  }
  if (!opts.length) return OPP[g.dir];
  if (g.fright && !g.eaten) return opts[Math.floor(Math.random() * opts.length)];
  let best = opts[0], bd = Infinity;
  for (const k of opts) { const v = DIRS[k]; const d = dist2(g.x + v.x, g.y + v.y, t.x, t.y); if (d < bd) { bd = d; best = k; } }
  return best;
}

function update(dt) {
  mouth += dt * 10;
  if (state === 'ready') { readyTimer -= dt; if (readyTimer <= 0) { state = 'play'; hideOverlay(); } return; }
  if (state === 'dying') { deathTimer -= dt; if (deathTimer <= 0) afterDeath(); return; }
  if (state === 'levelclear') { clearTimer -= dt; if (clearTimer <= 0) nextLevel(); return; }
  if (state !== 'play') return;

  // mode timers
  if (frightTimer > 0) { frightTimer -= dt; if (frightTimer <= 0) { ghosts.forEach(g => g.fright = false); ghostCombo = 0; } }
  else if (modeTimer !== Infinity) { modeTimer -= dt; if (modeTimer <= 0) { modeIndex = Math.min(modeIndex + 1, SCATTER_CHASE.length - 1); modeTimer = SCATTER_CHASE[modeIndex]; ghosts.forEach(g => { if (!g.eaten && g.mode === 'normal') g.dir = OPP[g.dir]; }); } }

  // player
  const ps = speedFor(level) * (frightTimer > 0 ? 1.08 : 1);
  stepEntity(player, ps * dt, false, playerDecide);
  const px = Math.round(player.x), py = Math.round(player.y);
  const c = cellAt(px, py);
  if (c.pellet || c.power) {
    if (c.pellet) addScore(10); else { addScore(50); frightTimer = frightFor(level); ghostCombo = 0; ghosts.forEach(g => { if (!g.eaten) { g.fright = true; if (g.mode === 'normal') g.dir = OPP[g.dir]; } }); sfx.power(); }
    c.pellet = c.power = false; pelletsLeft--;
    const now = performance.now(); if (now - lastDotSound > 90) { sfx.waka(); lastDotSound = now; }
    if (pelletsLeft <= 0) { state = 'levelclear'; clearTimer = 2.2; showOverlay('NÍVEL ' + level + ' LIMPO!', 'Build passou. Subindo para o nível ' + (level + 1) + '…', false); return; }
  }

  // ghosts
  for (const g of ghosts) {
    let sp = speedFor(level) * 0.92;
    if (g.eaten) sp = 12; else if (g.fright) sp = speedFor(level) * 0.55;
    if (cellAt(Math.round(g.x), Math.round(g.y)) && Math.abs(g.y - Math.round(g.y)) < .5 && Math.round(g.y) === doorCell.y && Math.abs(g.x - doorCell.x) < .6 && !g.eaten) sp *= .6;
    if (g.mode === 'house') {
      g.houseWait -= dt * (1 + (totalPellets - pelletsLeft) / totalPellets);
      g.bob += dt * 3;
      g.y = houseCells[0].y + Math.sin(g.bob) * .25;
      if (g.houseWait <= 0) { g.mode = 'exit'; g.y = houseCells[0].y; g.x = Math.round(g.x); g.dir = 'up'; }
      continue;
    }
    if (g.mode === 'exit') {
      // walk straight to door column then up
      if (Math.abs(g.x - doorCell.x) > 1e-3) { const d = Math.sign(doorCell.x - g.x); g.x += d * sp * dt; if (Math.sign(doorCell.x - g.x) !== d) g.x = doorCell.x; g.dir = d > 0 ? 'right' : 'left'; }
      else { g.x = doorCell.x; g.y -= sp * dt; g.dir = 'up'; if (g.y <= doorCell.y - 1) { g.y = doorCell.y - 1; g.mode = 'normal'; g.dir = Math.random() < .5 ? 'left' : 'right'; } }
      continue;
    }
    stepEntity(g, sp * dt, g.eaten, ghostDecide);
    if (g.eaten && Math.round(g.x) === doorCell.x && Math.round(g.y) === doorCell.y - 1 && atCenter(g)) {
      g.eaten = false; g.fright = false; g.mode = 'exit'; g.x = doorCell.x; g.y = houseCells[0].y;
    }
    // collision
    if (!g.eaten && g.mode === 'normal' && dist2(g.x, g.y, player.x, player.y) < .45) {
      if (g.fright) { g.eaten = true; g.fright = false; ghostCombo++; addScore(200 * Math.pow(2, ghostCombo - 1)); sfx.ghost(); }
      else { state = 'dying'; deathTimer = 1.6; sfx.death(); }
    }
  }
}
function afterDeath() {
  lives--; updateHud();
  if (lives <= 0) { state = 'gameover'; showOverlay('GAME OVER', 'Score ' + score + ' · Hi-score ' + hi + '. Stack overflow no labirinto.', true, 'JOGAR DE NOVO ▶'); return; }
  resetActors(); startReady();
}

// ---------- Rendering ----------
const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
const logo = new Image(); logo.src = LOGO_SRC;
const spr = document.createElement('canvas'); const sctx = spr.getContext('2d');
let dpr = 1;
function resize() {
  const r = stage.getBoundingClientRect(); dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
}
window.addEventListener('resize', resize); resize();

function drawMaze(s) {
  ctx.lineWidth = Math.max(1.5, s * .09); ctx.lineCap = 'round'; ctx.strokeStyle = '#2ef05f'; ctx.shadowColor = 'rgba(46,240,95,.6)'; ctx.shadowBlur = s * .25;
  ctx.fillStyle = '#0a2a14';
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (!grid[y][x].wall) continue;
    ctx.fillRect(x * s, y * s, s + .5, s + .5);
  }
  ctx.beginPath();
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (!grid[y][x].wall) continue;
    const X = x * s, Y = y * s;
    const nW = (yy, xx) => (yy >= 0 && yy < ROWS && xx >= 0 && xx < COLS) ? grid[yy][xx].wall : true;
    if (!nW(y - 1, x)) { ctx.moveTo(X, Y); ctx.lineTo(X + s, Y); }
    if (!nW(y + 1, x)) { ctx.moveTo(X, Y + s); ctx.lineTo(X + s, Y + s); }
    if (!nW(y, x - 1)) { ctx.moveTo(X, Y); ctx.lineTo(X, Y + s); }
    if (!nW(y, x + 1)) { ctx.moveTo(X + s, Y); ctx.lineTo(X + s, Y + s); }
  }
  ctx.stroke(); ctx.shadowBlur = 0;
  // door
  ctx.strokeStyle = '#ff9fd0'; ctx.lineWidth = s * .12;
  ctx.beginPath(); ctx.moveTo(doorCell.x * s + s * .1, doorCell.y * s + s * .5); ctx.lineTo(doorCell.x * s + s * .9, doorCell.y * s + s * .5); ctx.stroke();
}
function drawPellets(s, t) {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `${Math.round(s * .42)}px "JetBrains Mono", monospace`;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = grid[y][x]; const cx = x * s + s / 2, cy = y * s + s / 2;
    if (c.pellet) { ctx.fillStyle = '#9dffb6'; ctx.fillText((x * 7 + y * 3) % 2 ? '1' : '0', cx, cy + 1); }
    else if (c.power) {
      const p = .75 + Math.sin(t * 6) * .25;
      ctx.fillStyle = `rgba(61,255,110,${.25 * p})`; ctx.beginPath(); ctx.arc(cx, cy, s * .42 * p, 0, 7); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.font = `bold ${Math.round(s * .55)}px "JetBrains Mono", monospace`; ctx.fillText('$', cx, cy + 1);
      ctx.font = `${Math.round(s * .42)}px "JetBrains Mono", monospace`;
    }
  }
}
function drawPlayer(s, t) {
  const size = s * 1.55; const cx = player.x * s + s / 2, cy = player.y * s + s / 2;
  const W = Math.ceil(size * dpr) + 4;
  if (spr.width !== W) { spr.width = W; spr.height = W; }
  sctx.setTransform(1, 0, 0, 1, 0, 0); sctx.clearRect(0, 0, W, W);
  sctx.globalCompositeOperation = 'source-over';
  if (logo.complete && logo.naturalWidth) sctx.drawImage(logo, 2, 2, W - 4, W - 4);
  let open = state === 'dying' ? Math.min(Math.PI, (1.6 - deathTimer) * 2.2) : (player.moving || state === 'ready' ? Math.abs(Math.sin(mouth)) * .75 : .12);
  if (state === 'dying' && deathTimer < .15) return;
  const ang = { right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2 }[player.dir];
  sctx.globalCompositeOperation = 'destination-out';
  sctx.beginPath(); sctx.moveTo(W / 2, W / 2); sctx.arc(W / 2, W / 2, W, ang - open, ang + open); sctx.closePath(); sctx.fill();
  ctx.save(); ctx.shadowColor = 'rgba(255,255,255,.55)'; ctx.shadowBlur = s * .3;
  ctx.drawImage(spr, cx - size / 2, cy - size / 2, size, size);
  ctx.restore();
  // mouth outline rim for readability
  if (state !== 'dying') {
    ctx.strokeStyle = 'rgba(61,255,110,.9)'; ctx.lineWidth = Math.max(1, s * .05);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(ang - open) * size * .42, cy + Math.sin(ang - open) * size * .42);
    ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(ang + open) * size * .42, cy + Math.sin(ang + open) * size * .42); ctx.stroke();
  }
}
function drawGhost(g, s, t) {
  const cx = g.x * s + s / 2, cy = g.y * s + s / 2, r = s * .62;
  const flashing = frightTimer > 0 && frightTimer < 2 && Math.floor(t * 8) % 2 === 0;
  if (!g.eaten) {
    ctx.fillStyle = g.fright ? (flashing ? '#f4f4ff' : '#2436c8') : g.color;
    ctx.beginPath(); ctx.arc(cx, cy - r * .15, r, Math.PI, 0);
    const bottom = cy + r * .85, wave = r / 3;
    ctx.lineTo(cx + r, bottom);
    for (let i = 0; i < 3; i++) { const x0 = cx + r - i * 2 * wave; const bump = (Math.floor(t * 10) + i) % 2 ? .35 : .15; ctx.lineTo(x0 - wave, bottom - r * bump); ctx.lineTo(x0 - 2 * wave, bottom); }
    ctx.closePath(); ctx.fill();
    // "bug" antennae
    ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = Math.max(1, s * .06);
    ctx.beginPath(); ctx.moveTo(cx - r * .4, cy - r * .95); ctx.lineTo(cx - r * .6, cy - r * 1.4); ctx.moveTo(cx + r * .4, cy - r * .95); ctx.lineTo(cx + r * .6, cy - r * 1.4); ctx.stroke();
  }
  // eyes
  const v = DIRS[g.dir] || { x: 0, y: 0 };
  const ex = r * .34, ey = -r * .2;
  for (const sgn of [-1, 1]) {
    ctx.fillStyle = g.fright && !g.eaten ? (flashing ? '#2436c8' : '#f4f4ff') : '#fff';
    ctx.beginPath(); ctx.ellipse(cx + sgn * ex, cy + ey, r * .22, r * .28, 0, 0, 7); ctx.fill();
    if (!(g.fright && !g.eaten)) { ctx.fillStyle = '#1b2a8f'; ctx.beginPath(); ctx.arc(cx + sgn * ex + v.x * r * .1, cy + ey + v.y * r * .12, r * .12, 0, 7); ctx.fill(); }
  }
  if (g.fright && !g.eaten) { // jagged mouth
    ctx.strokeStyle = flashing ? '#2436c8' : '#f4f4ff'; ctx.lineWidth = Math.max(1, s * .05);
    ctx.beginPath(); for (let i = 0; i <= 6; i++) ctx.lineTo(cx - r * .5 + i * r / 6, cy + r * .35 + (i % 2 ? -r * .12 : 0)); ctx.stroke();
  }
}
function render(t) {
  const W = canvas.width, H = canvas.height; const s = Math.min(W / COLS, H / ROWS);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  ctx.translate((W - s * COLS) / 2, (H - s * ROWS) / 2);
  if (!grid) return;
  drawMaze(s); drawPellets(s, t);
  for (const g of ghosts) drawGhost(g, s, t);
  drawPlayer(s, t);
  if (ghostCombo > 0 && frightTimer > 0) { /* floating score handled implicitly via HUD */ }
}

// ---------- Loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); render(now / 1000);
  requestAnimationFrame(frame);
}

// ---------- Binary rain background ----------
const rain = document.getElementById('rain'), rctx = rain.getContext('2d');
let drops = [];
function rainResize() { rain.width = innerWidth; rain.height = innerHeight; const n = Math.floor(innerWidth / 18); drops = Array.from({ length: n }, (_, i) => ({ x: i * 18, y: Math.random() * innerHeight, v: 40 + Math.random() * 90 })); }
window.addEventListener('resize', rainResize); rainResize();
let rl = performance.now();
function rainFrame(now) {
  const dt = Math.min(.05, (now - rl) / 1000); rl = now;
  rctx.fillStyle = 'rgba(4,7,5,.18)'; rctx.fillRect(0, 0, rain.width, rain.height);
  rctx.fillStyle = '#3dff6e'; rctx.font = '13px "JetBrains Mono", monospace';
  for (const d of drops) { rctx.fillText(Math.random() < .5 ? '0' : '1', d.x, d.y); d.y += d.v * dt * 3; if (d.y > rain.height + 20) { d.y = -20; d.v = 40 + Math.random() * 90; } }
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(rainFrame);
}

function start(data) {
  buildGrid(); resetActors(); updateHud();
  if (data && data.hi > hi) hi = data.hi;
  requestAnimationFrame(frame); requestAnimationFrame(rainFrame);
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ hi }));
}
(window.claude && window.claude.hot && window.claude.hot.ready) ? window.claude.hot.ready(start) : start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>

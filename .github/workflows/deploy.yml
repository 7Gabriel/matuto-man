name: Deploy

# Push na main: constrói a imagem, publica no GHCR e atualiza o container na VPS via SSH.
# Manual: Actions > Deploy > Run workflow.
# Precisa de:
#   - variável de repositório DOMINIO_JOGO (ex.: jogo.omatutoprogramador.com.br), com registro A apontando para a VPS
#   - segredo VPS_SSH_KEY: chave privada ed25519 autorizada no usuário "deploy" da VPS
#     (autorizada pelo workflow "Autorizar chave de deploy" do repo analisador-simetria-facial)
# O host da VPS é resolvido pelo DNS do próprio domínio do jogo; não há IP fixo aqui.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-matuto-man
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGEM: ghcr.io/7gabriel/matuto-man

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGEM }}:${{ github.sha }}
            ${{ env.IMAGEM }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolver VPS pelo domínio do jogo
        id: dns
        env:
          DOMINIO: ${{ vars.DOMINIO_JOGO }}
        run: |
          [ -n "$DOMINIO" ] || { echo "::error::Defina a variável de repositório DOMINIO_JOGO (Settings > Secrets and variables > Actions > Variables)."; exit 1; }
          [[ "$DOMINIO" =~ ^([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}$ ]] || { echo "::error::DOMINIO_JOGO inválido: $DOMINIO"; exit 1; }
          HOST=$(getent ahostsv4 "$DOMINIO" | awk '{print $1}' | sort -u | head -1)
          [ -n "$HOST" ] || { echo "::error::$DOMINIO não resolve. Crie o registro A apontando para o IP da VPS antes."; exit 1; }
          echo "$DOMINIO -> $HOST"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "dominio=$DOMINIO" >> "$GITHUB_OUTPUT"
      - name: Publicar na VPS
        env:
          HOST: ${{ steps.dns.outputs.host }}
          DOMINIO: ${{ steps.dns.outputs.dominio }}
          TAG: ${{ env.IMAGEM }}:${{ github.sha }}
        run: |
          [ -n "${{ secrets.VPS_SSH_KEY }}" ] || { echo "::error::Segredo VPS_SSH_KEY ausente."; exit 1; }
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          # A chave do host é confiada no primeiro contato e fixada no log (ver fingerprint abaixo)
          ssh-keyscan -t ed25519 -T 10 "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh-keygen -lf ~/.ssh/known_hosts
          ssh -o BatchMode=yes deploy@"$HOST" 'bash -s' -- "$TAG" "$DOMINIO" < deploy/deploy-vps.sh
